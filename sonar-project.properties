# SonarQube / SonarCloud settings. The server address, token, project key and organisation are NOT written here:
# the pipeline passes them in from GitHub repository secrets and variables (see .github/workflows/ci.yml and the README).

sonar.sources=hustlehub-backend,hustlehub-frontend/src,e2e/tests
sonar.tests=hustlehub-backend/tests,hustlehub-frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,e2e/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/newman/reports/**,**/postman/**,**/*.test.js,**/*.test.jsx,**/test/**,e2e/tests/**,docs/**

# Coverage produced by "npm run test:coverage" in each project
sonar.javascript.lcov.reportPaths=hustlehub-backend/coverage/lcov.info,hustlehub-frontend/coverage/lcov.info

# Coverage is not expected for operational scripts, configuration files and the app entry point
sonar.coverage.exclusions=hustlehub-backend/scripts/**,**/eslint.config.js,hustlehub-frontend/vite.config.js,hustlehub-frontend/src/main.jsx,e2e/**

# Duplication is measured on real code only
sonar.cpd.exclusions=**/*.test.js,**/*.test.jsx

sonar.sourceEncoding=UTF-8
