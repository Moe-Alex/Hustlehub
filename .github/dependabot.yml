# Keeps dependencies, GitHub Actions and Docker base images up to date by opening pull requests for new versions
# (and for security fixes), so known vulnerabilities do not sit unnoticed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /hustlehub-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /hustlehub-frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /hustlehub-backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /hustlehub-frontend
    schedule: { interval: weekly }
