# HustleHub+ CI/CD pipeline. Runs on every push and pull request, and can be started by hand from the Actions tab.
#
# Jobs (the first six run in parallel):
#   backend         lint (ESLint + security rules), unit tests with coverage, Newman API tests against MongoDB
#   frontend        lint, Vitest unit/integration tests with coverage, production build
#   dependency-audit  npm audit on both projects (fails on high or critical vulnerabilities)
#   trivy-scan      Trivy scans the repository for vulnerable dependencies, committed secrets and Dockerfile misconfigurations
#   docker-e2e      builds both Docker images, starts the whole stack with Docker Compose, runs the Playwright browser tests
#                   against it, then scans the built images with Trivy
#   sonarqube       static analysis with a quality gate (needs the coverage from backend and frontend)
#   pipeline-gate   the single result: it fails unless every job above passed
#
# Nothing here uses continue-on-error, so a failing test, lint error, vulnerability, secret or quality gate fails the run.
# No secret is written in this file. SONAR_TOKEN and SONAR_HOST_URL come from GitHub repository secrets; every other
# password or key used in a run (database password, JWT secret, admin password) is generated fresh for that run.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend - lint, unit tests, API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hustlehub-backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The CI database is a throw-away container on the runner with no real data, so this address is not a secret.
      MONGODB_URI: mongodb://localhost:27017/hustlehub
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hustlehub-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate a throw-away JWT secret and HTTPS certificate for this run
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout certs/key.pem -out certs/cert.pem

      - name: Static analysis (ESLint with security rules)
        run: npm run lint

      # Runs the unit tests and then the Newman API tests against a real MongoDB. The API server started for the Newman tests
      # is measured too, so the coverage report covers the controllers, routes and middleware as well as the unit-tested helpers.
      - name: Unit tests and API integration tests (Newman), with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            hustlehub-backend/coverage/lcov.info
            hustlehub-backend/coverage/lcov-report/
          if-no-files-found: warn

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: hustlehub-backend/newman/reports/
          if-no-files-found: warn

  frontend:
    name: Frontend - lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hustlehub-frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hustlehub-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static analysis (ESLint with security rules)
        run: npm run lint

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: hustlehub-frontend/coverage/
          if-no-files-found: warn

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: hustlehub-frontend/dist/

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit - backend (all dependencies)
        run: npm audit --audit-level=high
        working-directory: hustlehub-backend

      - name: npm audit - frontend (all dependencies)
        run: npm audit --audit-level=high
        working-directory: hustlehub-frontend

      - name: npm audit - end-to-end tests
        run: npm audit --audit-level=high
        working-directory: e2e

  trivy-scan:
    name: Trivy - dependencies, secrets, misconfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Scan the repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: "**/node_modules"
          exit-code: "1"
          format: table

  docker-e2e:
    name: Docker - build, run the full stack, browser tests, image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Create a throw-away .env for this run (random secrets, never stored)
        run: |
          MONGO_ROOT_PASSWORD="$(openssl rand -hex 16)"
          JWT_SECRET="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="Adm1n_$(openssl rand -hex 8)!"
          echo "::add-mask::$MONGO_ROOT_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$ADMIN_PASSWORD"
          {
            echo "MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "LOG_ENVIRONMENT=ci"
          } > .env
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build both images
        run: docker compose build

      - name: Start the whole stack (database, API, web) and wait until every container is healthy
        run: docker compose up -d --wait --wait-timeout 180

      - name: Show running containers
        run: docker compose ps

      - name: Create the admin account
        run: docker compose run --rm api node scripts/seedAdmin.js

      - name: Install the browser tests
        run: npm ci
        working-directory: e2e

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Browser tests against the running containers
        run: npx playwright test
        working-directory: e2e
        env:
          E2E_BASE_URL: https://localhost:8443
          E2E_ADMIN_EMAIL: admin@example.com

      - name: Scan the API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hustlehub-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan the web image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hustlehub-web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      - name: Stop and remove the containers
        if: always()
        run: docker compose down -v

  sonarqube:
    name: Static analysis - SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    # Dependabot pull requests cannot read the repository secrets, so the scan cannot run for them.
    if: github.actor != 'dependabot[bot]'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Check that SonarQube is configured
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::SONAR_TOKEN and SONAR_HOST_URL repository secrets are missing. Add them under Settings > Secrets and variables > Actions. See the README."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Sonar needs the full history to blame code correctly

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: hustlehub-backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: hustlehub-frontend/coverage

      - name: Make the coverage file paths relative to the repository root
        run: |
          sed -i 's#^SF:#SF:hustlehub-backend/#' hustlehub-backend/coverage/lcov.info
          sed -i 's#^SF:#SF:hustlehub-frontend/#' hustlehub-frontend/coverage/lcov.info

      - name: SonarQube scan (fails the job if the quality gate fails)
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true

  pipeline-gate:
    name: Pipeline result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [backend, frontend, dependency-audit, trivy-scan, docker-e2e, sonarqube]
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "success" ]; then continue; fi
            # The only job allowed to be skipped is SonarQube, and only for Dependabot (it has no access to the secrets).
            if [ "$result" = "skipped" ] && [ "$SONAR_RESULT" = "skipped" ] && [ "$ACTOR" = "dependabot[bot]" ]; then continue; fi
            echo "::error::At least one pipeline job did not succeed ($result)."
            exit 1
          done
          echo "All pipeline jobs succeeded."
